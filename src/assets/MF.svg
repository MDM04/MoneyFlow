<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>MF Programming Logo</title>
  <desc>Logo vetorial com as iniciais MF e elementos de programação.</desc>

  <!-- Terminal / code frame -->
  <path d="M135 205 H665" fill="none" stroke="#14213D" stroke-width="34" stroke-linecap="round"/>
  <path d="M135 205 V245" fill="none" stroke="#14213D" stroke-width="34" stroke-linecap="round"/>
  <path d="M135 555 V595" fill="none" stroke="#14213D" stroke-width="34" stroke-linecap="round"/>
  <path d="M135 595 H665" fill="none" stroke="#14213D" stroke-width="34" stroke-linecap="round"/>

  <!-- Terminal dots -->
  <circle cx="615" cy="205" r="15" fill="#1769FF"/>
  <circle cx="185" cy="595" r="11" fill="#1769FF"/>
  <circle cx="225" cy="595" r="11" fill="#1769FF"/>
  <circle cx="265" cy="595" r="11" fill="#1769FF"/>

  <!-- M monogram -->
  <path d="M175 285 L175 505 L225 535 L225 365 L300 430 L375 365 L375 535 L425 505 L425 285 L300 390 Z"
        fill="#1769FF"/>

  <!-- F monogram -->
  <path d="M455 285 H635 L610 335 H515 V390 H600 L575 440 H515 V505 L455 535 Z"
        fill="#14213D"/>

  <!-- Code symbol -->
  <path d="M495 505 L450 545 L495 585" fill="none" stroke="#1769FF" stroke-width="22"
        stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M610 505 L655 545 L610 585" fill="none" stroke="#1769FF" stroke-width="22"
        stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M575 495 L535 595" fill="none" stroke="#14213D" stroke-width="18"/>

  <!-- Small accent -->
  <circle cx="665" cy="245" r="6" fill="#1769FF"/>
</svg>
